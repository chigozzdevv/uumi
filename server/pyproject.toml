[project]
name = "firekey-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cachecontrol>=0.14,<1",
    "cryptography>=46,<48",
    "fastapi>=0.116,<1",
    "firekey-contracts",
    "firekey-policy",
    "firekey-telemetry",
    "google-cloud-firestore>=2.28,<3",
    "google-cloud-aiplatform[agent_engines,adk]>=1.144,<2",
    "google-cloud-pubsub>=2.39,<3",
    "google-adk[gcp]>=2,<3",
    "httpx>=0.28,<1",
    "playwright>=1.55,<2",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
    "mcp>=2,<3",
]

[tool.uv.sources]
firekey-contracts = { workspace = true }
firekey-policy = { workspace = true }
firekey-telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "api", "broker", "browser", "capture", "connectors", "coordinator", "core", "ingestion", "publisher", "verifier"]
