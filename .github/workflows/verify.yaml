name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
      - name: Install dependencies
        run: make sync
      - name: Verify
        run: make verify
      - name: Start Firestore emulator
        run: |
          docker run --detach \
            --name uumi-firestore \
            --publish 8787:8787 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:528.0.0-emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8787
          for attempt in {1..30}; do
            if curl --silent http://127.0.0.1:8787 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs uumi-firestore
          exit 1
      - name: Start Pub/Sub emulator
        run: |
          docker run --detach \
            --name uumi-pubsub \
            --publish 8788:8788 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:528.0.0-emulators \
            gcloud beta emulators pubsub start --host-port=0.0.0.0:8788 --project=uumi-test
          for attempt in {1..30}; do
            if nc -z 127.0.0.1 8788; then
              exit 0
            fi
            sleep 1
          done
          docker logs uumi-pubsub
          exit 1
      - name: Verify durable event delivery
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8787
          PUBSUB_EMULATOR_HOST: 127.0.0.1:8788
        run: uv run pytest server/tests/integration -m integration
      - name: Build runtime images
        run: make images
      - name: Validate infrastructure
        run: make infra
