[project]
name = "uumi-testkit"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["uumi-contracts", "uumi-policy", "uumi-server"]

[tool.uv.sources]
uumi-contracts = { workspace = true }
uumi-policy = { workspace = true }
uumi-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testkit"]
