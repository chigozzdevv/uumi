[project]
name = "firekey-testkit"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["firekey-contracts", "firekey-policy", "firekey-server"]

[tool.uv.sources]
firekey-contracts = { workspace = true }
firekey-policy = { workspace = true }
firekey-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/testkit"]
