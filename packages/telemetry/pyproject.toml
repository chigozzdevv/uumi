[project]
name = "uumi-telemetry"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "opentelemetry-api>=1.36,<2",
    "opentelemetry-exporter-gcp-monitoring>=1.11,<2",
    "opentelemetry-exporter-gcp-trace>=1.11,<2",
    "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
    "opentelemetry-instrumentation-httpx>=0.57b0,<1",
    "opentelemetry-resourcedetector-gcp>=1.11,<2",
    "opentelemetry-sdk>=1.36,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry"]
