[project]
name = "uumi-policy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["uumi-contracts"]

[tool.uv.sources]
uumi-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy"]

